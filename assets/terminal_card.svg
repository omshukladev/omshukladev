<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680">
  <defs>
    <style>
      .term-bg { rx: 10; }
      .term-bar { rx: 10; }
      .term-title { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 12px; }

      /* Light Mode */
      .term-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .term-bar { fill: #eaeef2; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .term-title { fill: #57606a; }

      /* Dark Mode */
      @media (prefers-color-scheme: dark) {
        .term-bg { fill: #0d1117; stroke: #30363d; }
        .term-bar { fill: #161b22; }
        .term-title { fill: #8b949e; }
      }

      .cursor {
        animation: cursorBlink 1s step-end infinite;
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .line { opacity: 0; animation: lineFade 0.4s ease-out forwards; }
      .l1  { animation-delay: 0.05s; }
      .l2  { animation-delay: 0.10s; }
      .l3  { animation-delay: 0.15s; }
      .l4  { animation-delay: 0.20s; }
      .l5  { animation-delay: 0.25s; }
      .l6  { animation-delay: 0.30s; }
      .l7  { animation-delay: 0.35s; }
      .l8  { animation-delay: 0.40s; }
      .l9  { animation-delay: 0.45s; }
      .l10 { animation-delay: 0.50s; }
      .l11 { animation-delay: 0.55s; }
      .l12 { animation-delay: 0.60s; }
      .l13 { animation-delay: 0.65s; }
      .l14 { animation-delay: 0.70s; }
      .l15 { animation-delay: 0.75s; }
      .l16 { animation-delay: 0.80s; }
      .l17 { animation-delay: 0.85s; }
      .l18 { animation-delay: 0.90s; }
      .l19 { animation-delay: 0.95s; }
      .l20 { animation-delay: 1.00s; }
      .l21 { animation-delay: 1.05s; }
      .l22 { animation-delay: 1.10s; }
      .l23 { animation-delay: 1.15s; }
      .l24 { animation-delay: 1.20s; }
      .l25 { animation-delay: 1.25s; }

      @keyframes lineFade {
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect class="term-bg" x="0" y="0" width="940" height="680"/>

  <!-- Title Bar -->
  <rect class="term-bar" x="0" y="0" width="940" height="38"/>
  <circle class="dot-red" cx="22" cy="19" r="6"/>
  <circle class="dot-yellow" cx="42" cy="19" r="6"/>
  <circle class="dot-green" cx="62" cy="19" r="6"/>
  <text class="term-title" x="470" y="24" text-anchor="middle">omshukla@edge-node: ~ (neofetch)</text>

  <!-- Terminal Content Block -->
  <foreignObject x="20" y="46" width="900" height="624">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
