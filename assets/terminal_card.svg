          <div class="line l2"><span class="label">OS</span><span class="punct">: .................. </span>Arch Linux x86_64, macOS Darwin</div>
          <div class="line l3"><span class="label">Host</span><span class="punct">: ................ </span>Fullstack &amp; Real-time Systems Engineer</div>
          <div class="line l4"><span class="label">Kernel</span><span class="punct">: .............. </span>Node.js v22 LTS, Cloudflare V8 Workers</div>
