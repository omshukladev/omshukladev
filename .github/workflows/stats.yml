name: Generate Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub Stats Card
        uses: anuraghazra/github-readme-stats@master
        with:
          USERNAME: omshukladev
          SHOW_ICONS: "true"
          INCLUDE_ALL_COMMITS: "true"
          COUNT_PRIVATE: "true"
          THEME: github_dark
          HIDE_BORDER: "true"
          BG_COLOR: "0d1117"
          TITLE_COLOR: "58a6ff"
          ICON_COLOR: "58a6ff"
          TEXT_COLOR: "c9d1d9"
          RING_COLOR: "58a6ff"
          PAT: ${{ secrets.STATS_PAT }}
          OUTPUT_PATH: profile/stats.svg

      - name: Generate Top Languages Card
        uses: anuraghazra/github-readme-stats@master
        with:
          USERNAME: omshukladev
          LAYOUT: compact
          THEME: github_dark
          HIDE_BORDER: "true"
          BG_COLOR: "0d1117"
          TITLE_COLOR: "58a6ff"
          TEXT_COLOR: "c9d1d9"
          LANGS_COUNT: "8"
          CARD_TYPE: top-langs
          PAT: ${{ secrets.STATS_PAT }}
          OUTPUT_PATH: profile/top-langs.svg

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user: omshukladev
          theme: github-dark-blue
          hide_border: "true"
          background: "0d1117"
          ring: "58a6ff"
          fire: "58a6ff"
          currStreakLabel: "58a6ff"
          token: ${{ secrets.STATS_PAT }}
          output_path: profile/streak.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --staged --quiet || (git commit -m "📊 Update stats" && git push)
